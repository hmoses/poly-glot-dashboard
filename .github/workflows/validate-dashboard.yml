name: Validate Dashboard Metrics

on:
  pull_request:
    paths:
      - 'index.html'
      - 'fetch_analytics.py'
      - 'data/analytics.json'
      - 'scripts/validate_dashboard.py'
      - '.github/workflows/validate-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'fetch_analytics.py'
      - 'data/analytics.json'
      - 'scripts/validate_dashboard.py'
      - '.github/workflows/validate-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile Apple metrics and validate dashboard JavaScript
        run: python scripts/validate_dashboard.py
