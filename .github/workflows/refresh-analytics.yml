name: Refresh Analytics Hourly

on:
  # Redundant schedule attempts. The freshness guard ensures ASC is fetched
  # only when the committed dashboard data is at least 45 minutes old.
  schedule:
    - cron: '0 * * * *'
    - cron: '15 * * * *'
    - cron: '30 * * * *'
    - cron: '45 * * * *'

  # Manual recovery remains available.
  workflow_dispatch:

  # Any change to the fetcher or this workflow immediately validates the
  # refresh path instead of waiting for the next cron event.
  push:
    branches:
      - main
    paths:
      - 'fetch_analytics.py'
      - '.github/workflows/refresh-analytics.yml'

permissions:
  contents: write

concurrency:
  group: refresh-analytics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide whether refresh is needed
        id: freshness
        shell: bash
        run: |
          # Pushes and manual dispatches always run so code changes self-test.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHOULD_RUN=$(python - <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/analytics.json")
          try:
              data = json.loads(path.read_text())
              updated = datetime.fromisoformat(data["updated_at"].replace("Z", "+00:00"))
              age_minutes = (datetime.now(timezone.utc) - updated).total_seconds() / 60
              print(f"analytics age: {age_minutes:.1f} minutes", file=sys.stderr)
              print("true" if age_minutes >= 45 else "false")
          except Exception as exc:
              print(f"freshness check failed: {exc}", file=sys.stderr)
              print("true")
          PY
          )

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.freshness.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Fetch analytics from ASC
        if: steps.freshness.outputs.should_run == 'true'
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_REPORT_REQUEST_ID: ${{ secrets.ASC_REPORT_REQUEST_ID }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "ASC refresh attempt $attempt of 3"
            if python fetch_analytics.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Validate generated analytics
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          APP_ID = "6804499285"
          path = Path("data/analytics.json")
          data = json.loads(path.read_text())

          if not data.get("updated_at"):
              raise SystemExit("analytics.json missing updated_at")

          wrong_ids = sorted({
              str(r.get("App Apple Identifier"))
              for r in data.get("raw_downloads", [])
              if r.get("App Apple Identifier") and str(r.get("App Apple Identifier")) != APP_ID
          })
          if wrong_ids:
              raise SystemExit(f"analytics.json contains rows for wrong app IDs: {wrong_ids}")

          print("analytics.json validation passed")
          PY

      - name: Commit and push if changed
        if: steps.freshness.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/analytics.json

          if git diff --cached --quiet; then
            echo "No changes to analytics data"
            exit 0
          fi

          git commit -m "Auto-refresh analytics $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Another dashboard commit may land while ASC is being fetched.
          # Rebase onto the latest main before pushing.
          git pull --rebase origin main
          git push origin HEAD:main
