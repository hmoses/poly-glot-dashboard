name: Refresh Analytics Hourly
# Manual refresh trigger: 2026-10-01

on:
  # Hourly refresh; GitHub Actions scheduled jobs may be delayed.
  schedule:
    - cron: '7 * * * *'

  # Manual recovery remains available.
  workflow_dispatch:

  # Any change to the fetcher or this workflow immediately validates the
  # refresh path instead of waiting for the next scheduled run.
  push:
    branches:
      - main
    paths:
      - 'fetch_analytics.py'
      - '.github/workflows/refresh-analytics.yml'

permissions:
  contents: write

concurrency:
  group: refresh-analytics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Confirm PostHog key is supplied to refresh runner
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
        run: |
          if [ -n "$POSTHOG_PERSONAL_API_KEY" ]; then
            echo "PostHog analytics API credential: configured (value not printed)"
          else
            echo "::warning::PostHog analytics API credential is missing; ASC metrics will still refresh."
          fi

      - name: Fetch analytics from ASC
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_REPORT_REQUEST_ID: ${{ secrets.ASC_REPORT_REQUEST_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "ASC refresh attempt $attempt of 3"
            if python fetch_analytics.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Validate generated analytics
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          APP_ID = "6804499285"
          path = Path("data/analytics.json")
          data = json.loads(path.read_text())

          if not data.get("updated_at"):
              raise SystemExit("analytics.json missing updated_at")

          wrong_ids = sorted({
              str(r.get("App Apple Identifier"))
              for r in data.get("raw_downloads", [])
              if r.get("App Apple Identifier") and str(r.get("App Apple Identifier")) != APP_ID
          })
          if wrong_ids:
              raise SystemExit(f"analytics.json contains rows for wrong app IDs: {wrong_ids}")

          print("analytics.json validation passed")
          PY

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The fetcher writes both ASC analytics and PostHog output. Stage both
          # so the rebase/push step is not blocked by an unstaged posthog.json.
          git add data/analytics.json
          if [ -f data/posthog.json ]; then
            git add data/posthog.json
          fi

          if git diff --cached --quiet; then
            echo "No changes to analytics data"
            exit 0
          fi

          git commit -m "Auto-refresh analytics $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Another dashboard commit may land while ASC is being fetched.
          # Rebase onto the latest main before pushing.
          git pull --rebase origin main
          git push origin HEAD:main
